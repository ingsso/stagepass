# prod 오버라이드 — 기본값(values.yaml)에서 달라지는 값만 적습니다.
# helm upgrade stagepass charts/stagepass -f charts/stagepass/values-prod.yaml

replicaCount: 3

springProfile: k8s

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

config:
  corsAllowedOrigins: "https://stagepass.example.com"

# prod 에서는 인클러스터 의존 서비스를 쓰지 않는다는 의도를 값으로 표현합니다.
# (이 데모 클러스터에서 그대로 적용하면 postgres/redis/kafka 가 사라져 api 가 기동하지 못하므로,
#  실제 검증은 dev 값으로 하고 이 파일은 "환경별 값 분리" 자체를 보여주는 용도입니다.)
#
# dependencies:
#   postgres: { enabled: false }
#   redis:    { enabled: false }
#   kafka:    { enabled: false }
#
# config:
#   dbUrl: jdbc:postgresql://stagepass.xxxx.ap-northeast-2.rds.amazonaws.com:5432/stagepass
#   redisHost: stagepass.xxxx.ng.0001.apn2.cache.amazonaws.com
#   kafkaBootstrapServers: b-1.stagepass.xxxx.kafka.ap-northeast-2.amazonaws.com:9092
#
# secrets:
#   create: false   # Sealed Secrets / External Secrets 가 만든 Secret 을 참조
