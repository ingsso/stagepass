{{- if .Values.secrets.create }}
# ⚠️ 데모 전용. 운영에서는 secrets.create=false 로 두고
# Sealed Secrets / External Secrets Operator 가 만든 Secret 을 참조하세요.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stagepass.secretName" . }}
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
