apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stagepass.fullname" . }}
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stagepass.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stagepass.apiSelectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap/Secret 내용이 바뀌면 Pod 를 새로 뜨게 합니다.
        # 이게 없으면 값만 바꿨을 때 Deployment 스펙이 그대로라 롤아웃이 일어나지 않고,
        # 기존 Pod 가 옛 설정을 그대로 들고 살아남습니다.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: api
          image: {{ include "stagepass.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stagepass.secretName" . }}
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stagepass.secretName" . }}
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: {{ include "stagepass.fullname" . }}-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
