{{- if .Values.dependencies.kafka.enabled }}
# 데모 스코프의 인클러스터 Kafka (KRaft 단일 노드 — Zookeeper 없음, 영속화 없음).
# 실무에서는 enabled=false 로 끄고 MSK / Strimzi Operator 를 사용합니다.
#
# ★ 이 브로커는 선택 사항이 아닙니다.
#   infra/kafka 모듈이 @ConditionalOnProperty("spring.kafka.bootstrap-servers") 로 묶여 있고
#   EventPublisher 를 8개 서비스가 필수 주입받으므로, 브로커에 붙지 못하면 api 가 기동하지 않습니다.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  selector:
    app.kubernetes.io/component: kafka
    {{- include "stagepass.selectorLabels" . | nindent 4 }}
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate          # 단일 브로커 — 롤링 중 두 인스턴스가 겹치면 안 됩니다
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
      {{- include "stagepass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka
        {{- include "stagepass.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: {{ .Values.dependencies.kafka.image | quote }}
          ports:
            - containerPort: 9092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # 클라이언트가 접속할 주소 — 클러스터 내부 DNS 이름이어야 합니다
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            # 브로커가 1대뿐이라 복제 계수는 전부 1
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
            - name: CLUSTER_ID
              value: {{ .Values.dependencies.kafka.clusterId | quote }}
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.dependencies.kafka.heapOpts | quote }}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
