{{- if .Values.dependencies.postgres.enabled }}
# 데모 스코프의 인클러스터 PostgreSQL (emptyDir — Pod 재시작 시 데이터 소실).
# 실무에서는 dependencies.postgres.enabled=false 로 끄고 RDS 엔드포인트를 config.dbUrl 에 넣습니다.
#
# 의존 서비스 이름은 릴리스명을 붙이지 않습니다.
# config.dbUrl 같은 접속 문자열이 이 이름을 그대로 참조하기 때문입니다
# (네임스페이스당 릴리스 1개를 전제로 한 데모 스코프의 단순화).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
    {{- include "stagepass.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "stagepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      {{- include "stagepass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "stagepass.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.dependencies.postgres.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.dependencies.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.dbUsername | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stagepass.secretName" . }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.config.dbUsername | quote }}
                - -d
                - {{ .Values.dependencies.postgres.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
