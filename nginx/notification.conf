upstream notification_backend {
    server notification-1:8083;
    server notification-2:8083;
}

server {
    listen 80;

    # SSE 전용 — 버퍼링 완전 비활성화 (SSE 이벤트 실시간 전달을 위해 필수)
    location /api/notifications/subscribe {
        proxy_pass http://notification_backend;
        proxy_http_version 1.1;

        # SSE는 청크 스트리밍 → Connection 헤더 제거
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 버퍼링 비활성화 (설정하지 않으면 nginx가 SSE를 청크 단위로 모아서 전송)
        proxy_buffering off;
        proxy_cache off;

        # SSE는 장기 연결 — 타임아웃을 30분으로 설정
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;

        chunked_transfer_encoding on;
    }

    # 일반 REST API
    location / {
        proxy_pass http://notification_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
