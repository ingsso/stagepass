# 데모 스코프: 인클러스터 Kafka (KRaft 단일 노드, Zookeeper 없음, 영속화 없음)
#
# docker-compose 는 confluentinc/cp-kafka + Zookeeper 조합이지만,
# 클러스터에서는 노드 1개로 끝나는 KRaft 모드를 씁니다 — Zookeeper Pod 가 통째로 사라집니다.
# 실무라면 MSK / Strimzi Operator 로 다중 브로커를 운영합니다.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  selector: { app: kafka }
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  replicas: 1
  strategy:
    type: Recreate          # 단일 브로커 — 롤링 중 두 인스턴스가 겹치면 안 됩니다
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # 클라이언트가 접속할 주소 — 클러스터 내부 DNS 이름이어야 합니다
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            # 브로커가 1대뿐이라 복제 계수는 전부 1
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
            - { name: CLUSTER_ID, value: "5L6g3nShT-eMCtK--X86sw" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /tmp/kraft-combined-logs }
      volumes:
        - name: data
          emptyDir: {}
