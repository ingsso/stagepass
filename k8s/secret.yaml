# ⚠️ 데모 전용 Secret — 로컬 k3d 클러스터에서만 사용하는 값입니다.
#
# 실제 운영에서 평문 Secret 을 Git 에 커밋하면 안 됩니다.
# GitOps 에서의 정석은 Sealed Secrets / External Secrets Operator / SOPS 로
# 암호화된 형태만 커밋하고, 클러스터 안에서 복호화하는 것입니다.
# 이 저장소는 포트폴리오 데모 스코프라 값 자체가 무의미한 더미이므로 평문으로 둡니다.
apiVersion: v1
kind: Secret
metadata:
  name: stagepass-secret
type: Opaque
stringData:
  db-password: stagepass1234
  jwt-secret: k8s-demo-secret-key-must-be-at-least-32-characters-long
