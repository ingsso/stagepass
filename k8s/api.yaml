apiVersion: v1
kind: ConfigMap
metadata:
  name: stagepass-api-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/stagepass
  DB_USERNAME: stagepass
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
---
apiVersion: v1
kind: Service
metadata:
  name: stagepass-api
  labels: { app: stagepass-api }
spec:
  selector: { app: stagepass-api }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagepass-api
  labels: { app: stagepass-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: stagepass-api }
  template:
    metadata:
      labels: { app: stagepass-api }
    spec:
      containers:
        - name: api
          image: stagepass-api:0.1.0
          imagePullPolicy: IfNotPresent   # ★ k3d 로 import 한 로컬 이미지를 쓰기 위해 필수
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: k8s }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: stagepass-secret, key: db-password }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stagepass-secret, key: jwt-secret }
          envFrom:
            - configMapRef: { name: stagepass-api-config }
          # startupProbe 로 느린 기동을 흡수하고, liveness 는 짧게 가져갑니다.
          # (startupProbe 없이 liveness 만 두면 기동 중인 Pod 를 죽여 CrashLoop 가 됩니다)
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30          # 최대 150초 대기
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
